<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>干城鹹水雞 點餐</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="store-header">
        <div class="store-header-content">
            <div class="store-header-top">
                <div class="store-logo-wrapper">
                    <!-- 請確認 logo.png 位於相同目錄 -->
                    <img src="./logo.png" alt="Gancheng Logo" class="store-logo">
                </div>
                <div class="store-info">
                    <h1 class="store-name">干城鹹水雞</h1>
                    <p class="store-subtitle">台中黎明店</p>
                </div>
                <div class="store-status-wrapper">
                    <div id="store-status" class="store-status">營業中</div>
                    <div id="waiting-counter-badge" class="waiting-badge" style="display: none;"></div>
                </div>
            </div>
            <div class="store-details">
                <div class="store-detail-row">
                    <span class="detail-icon">📍</span>
                    <span>台中市南屯區黎明里干城街302號</span>
                </div>
                <div class="store-detail-row">
                    <span class="detail-icon">🕒</span>
                    <div class="time-block" id="store-hours-display">
                        <div>週一、週五、週六、週日&nbsp;&nbsp;16:30-21:30</div>
                        <div>週二、週三、週四&nbsp;&nbsp;公休</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="sticky-nav">
        <div class="sticky-nav-content" id="main-nav">
            <div class="nav-btn active" onclick="scrollToSec('sec-flavor')">🧪 口味選擇</div>
            <div class="nav-btn" onclick="scrollToSec('sec-meat')">🍗 肉類</div>
            <div class="nav-btn" onclick="scrollToSec('sec-side50')">小菜$50</div>
            <div class="nav-btn" onclick="scrollToSec('sec-side30')">小菜$30</div>
            <div class="nav-btn" onclick="scrollToSec('sec-side25')">小菜$25</div>
            <div class="nav-btn" onclick="scrollToSec('sec-veggie')">蔬菜/配菜</div>
            <div class="nav-btn" onclick="scrollToSec('sec-checkout')">結帳</div>
        </div>
    </nav>

    <div class="container main-layout">
        <div class="menu-column">
            <div class="section-container" id="sec-flavor"></div>

            <div class="section-container" id="sec-meat">
                <div class="section-title">🍗 肉類</div>
                <div class="grid" id="meat-list"></div>
            </div>

            <div class="section-container" id="sec-side50">
                <div class="section-title">⭐ 精選小菜 $50/份</div>
                <div class="grid" id="side50-list"></div>
            </div>

            <div class="section-container" id="sec-side30">
                <div class="section-title">🥘 特色小菜 $30/份</div>
                <div class="grid" id="side30-list"></div>
            </div>

            <div class="section-container" id="sec-side25">
                <div class="section-title">🥗 經典小菜 $25/份</div>
                <div class="grid" id="side25-list"></div>
            </div>

            <div class="section-container" id="sec-veggie">
                <div class="section-title">🥦 蔬菜/配菜 1份$35 / 3份$100</div>
                <div class="grid" id="veggie-list"></div>
            </div>
            <div class="checkout-column">
                <div class="section-container" id="sec-checkout" style="margin-top: 20px;">
                    <div class="section-title">🛍️ 購物車清單</div>
                    <div id="cart-summary"
                        style="margin-bottom: 20px; padding: 12px; background: #fff; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; color: #444;">
                        <div style="text-align:center; color:#9ca3af;">(目前沒有已選商品)</div>
                    </div>

                    <div class="section-title">🕒 取餐日期</div>
                    <div class="input-group">
                        <label style="font-weight: 800; color: var(--primary);">⚠️ 請選擇取餐日期</label>
                        <div class="datetime-row">
                            <input type="date" id="pickup-date">
                        </div>
                    </div>

                    <div class="section-title">📝 其他要求</div>
                    <div class="input-group">
                        <textarea id="note" rows="3" placeholder="例如：切半、多汁一點、洋蔥多一點"></textarea>
                    </div>
                </div>

                <div class="footer">
                    <div class="total-wrap" onclick="scrollToSec('sec-checkout')">
                        <span style="font-size: 32px; line-height:1;">🛒</span>
                        <span id="cart-badge"
                            style="display:none; position:absolute; top:-6px; right:-10px; background:var(--red); color:#fff; font-size:11px; font-weight:900; border-radius:99px; padding: 2px 6px; min-width:18px; text-align:center;">0</span>
                        <span class="total-price">$<span id="total-price">0</span></span>
                    </div>
                    <button class="btn-send" id="btn-submit" onclick="submitOrder()">確認下單</button>
                </div>
            </div>
        </div>

        <div id="custom-alert" class="custom-alert-overlay">
            <div class="custom-alert-box">
                <div class="custom-alert-header">提醒</div>
                <div id="custom-alert-message" class="custom-alert-body"></div>
                <button class="custom-alert-btn" onclick="closeCustomAlert()">確定</button>
            </div>
        </div>

        <div id="pending-action-modal" class="custom-alert-overlay" style="display:none; z-index: 3000;">
            <div class="custom-alert-box" style="max-width: 380px;">
                <div class="custom-alert-header" style="color: var(--primary);">⚠️ 訂單異動通知</div>
                <div id="pending-action-text" class="custom-alert-body" style="white-space: pre-line; text-align: left; max-height: 250px; overflow-y: auto;"></div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="btn-pending-reject" class="custom-alert-btn" style="background: #e0e0e0; color: #333;" onclick="resolvePendingAction(false)">取消訂單</button>
                    <button id="btn-pending-accept" class="custom-alert-btn" style="background: var(--primary); color: #fff;" onclick="resolvePendingAction(true)">同意變更</button>
                </div>
            </div>
        </div>

        <div id="image-lightbox" class="custom-alert-overlay" style="display:none; z-index: 2000;"
            onclick="closeImageLightbox()">
            <img id="lightbox-img" src=""
                style="max-width: 90%; max-height: 90%; border-radius: 16px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        </div>

        <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
        <script>

            const WORKER_BASE = "https://bsc-worker-production.thuanmnc.workers.dev";
            let menu = { large: {}, small: {}, combo: {}, drinks: {}, veggie: {}, topping: {} };
            let imageList = [];
            let storeConfig = null;

            async function fetchMenu() {
                try {
                    const [resMenu, resImage, resConfig] = await Promise.all([
                        fetch(`${WORKER_BASE}/api/menu?_t=${Date.now()}`, { cache: 'no-store' }),
                        fetch(`${WORKER_BASE}/api/image_list?_t=${Date.now()}`, { cache: 'no-store' }),
                        fetch(`${WORKER_BASE}/api/config?_t=${Date.now()}`, { cache: 'no-store' })
                    ]);
                    if (resMenu.ok) menu = await resMenu.json();
                    if (resImage.ok) imageList = await resImage.json();
                    if (resConfig.ok) storeConfig = await resConfig.json();
                } catch (e) {
                    console.error("Failed to fetch menu or config", e);
                }
            }

            let cart = {};
            let customizeData = {};
            let currentPopup = null;
            let isSubmitting = false;

            // --- NAV / SCROLL ---
            function scrollToSec(id) {
                document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
            }

            const observerOptions = { root: null, rootMargin: '-80px 0px -70% 0px', threshold: 0 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                        const targetBtn = document.querySelector(`.nav-btn[onclick="scrollToSec('${entry.target.id}')"]`);
                        if (targetBtn) {
                            targetBtn.classList.add('active');
                            const nav = document.getElementById('main-nav');
                            nav.scrollTo({ left: targetBtn.offsetLeft - 20, behavior: 'smooth' });
                        }
                    }
                });
            }, observerOptions);

            // --- ALERT & LIGHTBOX ---
            function customAlert(msg, callback = null) {
                document.getElementById('custom-alert-message').innerHTML = msg;
                document.getElementById('custom-alert').style.display = 'flex';
                window.alertCallback = callback;
            }
            function closeCustomAlert() {
                document.getElementById('custom-alert').style.display = 'none';
                if (window.alertCallback) { window.alertCallback(); window.alertCallback = null; }
            }

            async function submitOrder() {
                if (isSubmitting) return;

                const hasItem = Object.values(cart).some(q => q > 0);
                if (!hasItem) return customAlert('請選擇品項');

                const secCheckout = document.getElementById('sec-checkout');
                if (secCheckout) {
                    const rect = secCheckout.getBoundingClientRect();
                    if (rect.top > 120) {
                        secCheckout.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        secCheckout.style.outline = '3px solid var(--primary)';
                        secCheckout.style.borderRadius = '16px';
                        setTimeout(() => { secCheckout.style.outline = 'none'; }, 2000);
                        return customAlert('請先確認下方訂單明細與取餐日期 ↓');
                    }
                }

                const dateInput = document.getElementById('pickup-date') ? document.getElementById('pickup-date').value : '';

                if (!dateInput) {
                    const timeSection = document.getElementById('sec-checkout');
                    if (timeSection) {
                        timeSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        timeSection.style.outline = '3px solid var(--primary)';
                        timeSection.style.borderRadius = '16px';
                        setTimeout(() => { timeSection.style.outline = 'none'; }, 2000);
                    }
                    setTimeout(() => {
                        const pInput = document.getElementById('pickup-date');
                        if (pInput) pInput.focus();
                    }, 400);
                    return customAlert('請先選取取餐日期 ↓');
                }

                const nowTaiwan = new Date(Date.now() + 8 * 3600000);
                const todayStr = nowTaiwan.toISOString().split('T')[0];
                if (dateInput < todayStr) return customAlert('不能選擇過去的日期，請重新選擇');

                const pickupDate = new Date(dateInput);
                const dayOfWeek = pickupDate.getDay();

                let isClosed = false;
                if (storeConfig && storeConfig.operatingHours) {
                    const shifts = storeConfig.operatingHours[dayOfWeek] || [];
                    if (shifts.length === 0) {
                        isClosed = true;
                    }
                } else {
                    if (dayOfWeek === 2 || dayOfWeek === 3 || dayOfWeek === 4) {
                        isClosed = true;
                    }
                }

                if (isClosed) {
                    return customAlert('當天店家公休，請選擇其他日期');
                }

                isSubmitting = true;
                const submitBtn = document.getElementById('btn-submit');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerText = '處理中...';
                }

                try {
                    const currentTotal = updateTotal();
                    const orderNum = generateOrderNumber();

                    let customSummaries = [];

                    (loadedCustomizations || []).forEach(group => {
                        const inputName = `opt-${group.key}`;
                        if (group.type === 'radio') {
                            const checkedRadio = document.querySelector(`input[name="${inputName}"]:checked`);
                            const val = checkedRadio ? checkedRadio.value : '';

                            let subDetails = '';
                            if (val) {
                                const activeSubContainer = document.querySelector(`.sub-option-container[data-parent-flavor="${val}"]`);
                                if (activeSubContainer) {
                                    let subOpts = [];
                                    activeSubContainer.querySelectorAll('input[type="checkbox"]:checked').forEach(chk => {
                                        subOpts.push(chk.value);
                                    });
                                    if (subOpts.length > 0) {
                                        subDetails = ` (${subOpts.join('、')})`;
                                    }
                                }
                                const groupTitle = (group.title || '').replace(/^✦\s*/, '');
                                customSummaries.push(`${groupTitle}：${val}${subDetails}`);
                            }
                        } else {
                            let selectedChecks = [];
                            document.querySelectorAll(`input[name="${inputName}"]:checked`).forEach(chk => {
                                selectedChecks.push(chk.value);
                            });
                            if (selectedChecks.length > 0) {
                                const groupTitle = (group.title || '').replace(/^✦\s*/, '');
                                customSummaries.push(`${groupTitle}：${selectedChecks.join('、')}`);
                            }
                        }
                    });

                    let addOns = [];
                    if (document.getElementById('chk-coriander')?.checked) addOns.push('加香菜(+$15)');
                    if (document.getElementById('chk-lemon')?.checked) addOns.push('加檸檬汁(+$20)');
                    if (addOns.length > 0) {
                        customSummaries.push(`加價配料：${addOns.join('、')}`);
                    }

                    let msg = `訂單編號：${orderNum}\n📦 訂單內容：\n`;

                    for (let key in cart) {
                        if (cart[key] > 0) {
                            let [cat, origName] = key.split('_');
                            msg += `\n${cart[key]}份 x ${origName}`;
                        }
                    }

                    if (customSummaries.length > 0) {
                        msg += `\n\n⚙️ 客製化設定：`;
                        customSummaries.forEach(s => {
                            msg += `\n- ${s}`;
                        });
                    }

                    msg += `\n\n🕒 取餐日期：${dateInput}`;
                    const mainNote = document.getElementById('note')?.value || '';
                    if (mainNote) msg += `\n📝 總備註：${mainNote}`;
                    msg += `\n💰 總金額：$${currentTotal}`;

                    let profile = { userId: "", displayName: "顧客 (Web)" };
                    if (typeof liff !== 'undefined' && liff && liff.isLoggedIn && liff.isLoggedIn()) {
                        try {
                            const p = await liff.getProfile();
                            if (p && p.userId) profile = p;
                        } catch (pErr) {
                            console.warn("Could not fetch LIFF profile:", pErr);
                        }
                    }

                    const orderPayload = {
                        key: orderNum,
                        userId: profile.userId,
                        customer: profile.displayName,
                        time: dateInput,
                        content: msg.split('\n\n🕒')[0].replace('[Benmi 點餐]\n', ''),
                        total: currentTotal,
                        note: mainNote,
                        liffFallback: false
                    };

                    const res = await fetch(`${WORKER_BASE}/api/create`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(orderPayload)
                    });

                    if (!res.ok) {
                        throw new Error(`API returned status ${res.status}`);
                    }

                    // Reset cart upon successful API creation
                    cart = {};
                    updateTotal();
                    document.querySelectorAll('.qty-text').forEach(el => el.innerText = '0');

                    // Best-effort: try sending LINE message inside LINE client (isolated catch)
                    try {
                        if (typeof liff !== 'undefined' && liff && typeof liff.isInClient === 'function' && liff.isInClient()) {
                            if (typeof liff.sendMessages === 'function') {
                                await liff.sendMessages([{ type: 'text', text: msg }]);
                            }
                        }
                    } catch (liffMsgErr) {
                        console.warn("LIFF sendMessages skipped or failed:", liffMsgErr);
                    }

                    // Display Success Modal unconditionally since API creation succeeded
                    customAlert('<div style="margin-bottom: 15px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div><div style="font-size: 18px; line-height: 1.4; color: #111;">感謝您的訂單！餐點製作完成後，我們會再次通知您前來取餐，謝謝！</div>', () => {
                        if (typeof liff !== 'undefined' && liff && typeof liff.closeWindow === 'function') {
                            try { liff.closeWindow(); } catch (e) {}
                        }
                    });

                } catch (err) {
                    console.warn("Primary API flow failed, trying LIFF sendMessages fallback:", err);

                    try {
                        if (typeof liff !== 'undefined' && liff && typeof liff.sendMessages === 'function') {
                            await liff.sendMessages([{ type: 'text', text: msg }]);
                            customAlert('<div style="margin-bottom: 15px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="#10b981"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div><div style="font-size: 18px; line-height: 1.4; color: #111;">感謝您的訂單！餐點製作完成後，我們會再次通知您前來取餐，謝謝！</div>', () => {
                                if (typeof liff.closeWindow === 'function') try { liff.closeWindow(); } catch (e) {}
                            });
                        } else {
                            throw err;
                        }
                    } catch (liffErr) {
                        console.error("LIFF sendMessages fallback failed:", liffErr);
                        customAlert('傳送失敗，請重試或向店員反應。');
                    }
                } finally {
                    isSubmitting = false;
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = '確認下單';
                    }
                }
            }

            function setTodayDate() {
                const today = new Date();
                const offsetDate = new Date(today.getTime() + 8 * 3600000);
                const dateStr = offsetDate.toISOString().split('T')[0];
                const dateEl = document.getElementById('pickup-date');
                if (dateEl) { dateEl.value = dateStr; dateEl.min = dateStr; }
            }

            function isStoreOpen(twTime) {
                if (!storeConfig || !storeConfig.operatingHours) {
                    const day = twTime.getDay();
                    const hours = twTime.getHours();
                    const minutes = twTime.getMinutes();
                    const timeValue = hours + minutes / 60;
                    if (day === 1 || day === 5 || day === 6 || day === 0) {
                        return (timeValue >= 16.5 && timeValue < 21.5);
                    }
                    return false;
                }

                const day = twTime.getDay();
                const hours = twTime.getHours();
                const minutes = twTime.getMinutes();
                const timeValue = hours + minutes / 60;

                const shifts = storeConfig.operatingHours[day] || [];
                for (let shift of shifts) {
                    const [sH, sM] = shift.start.split(':').map(Number);
                    const [eH, eM] = shift.end.split(':').map(Number);
                    const startVal = sH + sM / 60;
                    const endVal = eH + eM / 60;
                    if (timeValue >= startVal && timeValue < endVal) {
                        return true;
                    }
                }
                return false;
            }

            function checkStoreStatus() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const twTime = new Date(utc + (8 * 3600000));

                const isOpen = isStoreOpen(twTime);

                const statusEl = document.getElementById('store-status');
                if (statusEl) {
                    if (isOpen) {
                        statusEl.innerText = '營業中';
                        statusEl.className = 'store-status';
                    } else {
                        statusEl.innerText = '休息中';
                        statusEl.className = 'store-status closed';
                    }
                }
            }

            function renderStoreOperatingHours() {
                const displayEl = document.getElementById('store-hours-display');
                if (!displayEl) return;

                if (storeConfig && storeConfig.operatingHours) {
                    const hrs = storeConfig.operatingHours;
                    const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
                    let html = "";

                    const getShiftsStr = (dayIdx) => {
                        const shifts = hrs[dayIdx] || [];
                        if (shifts.length === 0) return "公休";
                        return shifts.map(s => `${s.start}-${s.end}`).join(", ");
                    };

                    const monStr = getShiftsStr(1);
                    const tueStr = getShiftsStr(2);
                    const wedStr = getShiftsStr(3);
                    const thuStr = getShiftsStr(4);
                    const friStr = getShiftsStr(5);
                    const satStr = getShiftsStr(6);
                    const sunStr = getShiftsStr(0);

                    const weekdaysEqual = (monStr === tueStr && tueStr === wedStr && wedStr === thuStr && thuStr === friStr);
                    const weekendsEqual = (satStr === sunStr);

                    if (weekdaysEqual && weekendsEqual) {
                        html = `<div>週一~週五&nbsp;&nbsp;${monStr}</div>
                            <div>週六、週日&nbsp;&nbsp;${satStr}</div>`;
                    } else {
                        for (let i = 1; i <= 7; i++) {
                            const dayIdx = i === 7 ? 0 : i;
                            html += `<div>${days[dayIdx]}&nbsp;&nbsp;${getShiftsStr(dayIdx)}</div>`;
                        }
                    }
                    displayEl.innerHTML = html;
                } else {
                    displayEl.innerHTML = `<div>週一、週五~週日&nbsp;&nbsp;16:30-21:30</div>
                                       <div>週二~週四&nbsp;&nbsp;公休</div>`;
                }
            }

            async function initApp() {
                await fetchMenu();
                renderMenu();
                renderStoreOperatingHours();

                const targetLiffId = (storeConfig && storeConfig.liffId) ? storeConfig.liffId : '2009555608-DMioljsI';
                try {
                    await liff.init({ liffId: targetLiffId });
                } catch (e) {
                    console.error("LIFF Init Error", e);
                }

                try {
                    const saved = localStorage.getItem('benmi_cart_save');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        cart = parsed.cart || {};
                        localStorage.removeItem('benmi_cart_save');

                        for (let key in cart) {
                            if (cart[key] > 0) {
                                const firstUnder = key.indexOf('_');
                                if (firstUnder !== -1) {
                                    const cat = key.slice(0, firstUnder);
                                    const origName = key.slice(firstUnder + 1);
                                    updateQty(cat, origName, 0);
                                }
                            }
                        }
                    }
                } catch (e) { }
                setTodayDate();
                checkStoreStatus();
                setInterval(checkStoreStatus, 60000);
                fetchWaitingCounter();
                setInterval(fetchWaitingCounter, 30000);
                await checkPendingActions();
            }

            let indexOrdersETag = "";

            async function fetchWaitingCounter() {
                try {
                    const headers = {};
                    if (indexOrdersETag) headers["If-None-Match"] = indexOrdersETag;
                    const res = await fetch(`${WORKER_BASE}/api/orders/waiting-count`, { headers });
                    if (res.status === 304) return;
                    if (!res.ok) return;

                    const etag = res.headers.get("ETag");
                    if (etag) indexOrdersETag = etag;

                    const data = await res.json();
                    const badge = document.getElementById("waiting-counter-badge");
                    if (badge) {
                        const count = data.waitingCount || 0;
                        if (count > 0) {
                            badge.innerHTML = `<span class="waiting-badge-count">目前前方等待單數：${count} 單</span><span class="waiting-badge-sub">製作時間平均每單10分鐘</span>`;
                            badge.style.display = "inline-flex";
                        } else {
                            badge.style.display = "none";
                        }
                    }
                } catch (e) {
                    console.error("Error fetching waiting counter:", e);
                }
            }

            let currentPendingAction = null;

            async function checkPendingActions() {
                try {
                    if (!liff.isLoggedIn()) return;
                    const profile = await liff.getProfile();
                    if (!profile || !profile.userId) return;

                    const res = await fetch(`${WORKER_BASE}/api/pending-actions?userId=${profile.userId}`);
                    if (!res.ok) return;

                    const data = await res.json();
                    if (data.pending && data.pending.length > 0) {
                        currentPendingAction = data.pending[0];
                        const text = currentPendingAction.questionText || "您的訂單有所變更，請確認。";
                        document.getElementById('pending-action-text').innerText = text;
                        document.getElementById('pending-action-modal').style.display = 'flex';
                    }
                } catch (e) {
                    console.error("Error checking pending actions:", e);
                }
            }

            async function resolvePendingAction(isAgree) {
                if (!currentPendingAction) return;
                try {
                    const status = isAgree ? 'ACCEPTED' : 'REJECTED';
                    const res = await fetch(`${WORKER_BASE}/api/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            key: currentPendingAction.orderKey,
                            status: status,
                            reason: isAgree ? "客戶同意變更" : "客戶取消訂單"
                        })
                    });

                    document.getElementById('pending-action-modal').style.display = 'none';
                    if (res.ok) {
                        showCustomAlert(isAgree ? "已確認同意變更！" : "已為您取消訂單！", () => {
                            if (liff.isInClient && liff.isInClient()) {
                                liff.closeWindow();
                            }
                        });
                    }
                } catch (e) {
                    console.error("Failed to resolve pending action:", e);
                    document.getElementById('pending-action-modal').style.display = 'none';
                }
            }
            initApp();

            function openImageLightbox(src) {
                document.getElementById('lightbox-img').src = src;
                document.getElementById('image-lightbox').style.display = 'flex';
            }
            function closeImageLightbox() {
                document.getElementById('image-lightbox').style.display = 'none';
            }

            // --- MENU RENDER ---
            function createItem(displayName, price, category, containerId, origName, isRecommended) {
                const container = document.getElementById(containerId);
                if (!container) return;
                const div = document.createElement('div');
                div.className = 'card';
                div.id = `item-${category}-${origName}`;

                const badgeHTML = isRecommended ? `<span class="badge">👍 推薦</span>` : '';

                const imageKey = `${category}_${origName}`;
                const hasImage = imageList.includes(imageKey);
                const imgHTML = hasImage ? `<img class="item-img" src="${WORKER_BASE}/api/image?name=${encodeURIComponent(imageKey)}&v=2" alt="${origName}" loading="lazy" onclick="openImageLightbox(this.src)" style="cursor: zoom-in;">` : '';

                const isOos = menu.out_of_stock && menu.out_of_stock.includes(`${category}:${origName}`);
                if (isOos) {
                    div.style.opacity = '0.65';
                    div.style.pointerEvents = 'none';
                }

                const qtyControlHTML = isOos ? `
                    <div style="color: #dc2626; font-weight: 900; font-size: 14px; background: #fee2e2; padding: 4px 10px; border-radius: 6px; pointer-events: none;">已售完</div>
                ` : `
                    <div class="qty-control">
                        <button class="btn-qty" onclick="updateQty('${category}','${origName}',-1)">-</button>
                        <span class="qty-text" id="qty-${category}-${origName}">0</span>
                        <button class="btn-qty" onclick="updateQty('${category}','${origName}',1)">+</button>
                    </div>
                `;

                div.innerHTML = `
        <div class="card-main" style="${isOos ? 'pointer-events: none;' : ''}">
            ${imgHTML}
            <div class="card-info">
                <div>
                    <div class="card-title">${displayName} ${badgeHTML}</div>
                </div>
                <div class="card-footer">
                    <div class="card-price">$${price}</div>
                    ${qtyControlHTML}
                </div>
            </div>
        </div>
    `;
                container.appendChild(div);
            }

            function updateToppingStockStatus() {
                if (!menu || !menu.out_of_stock) return;
                const oos = menu.out_of_stock;

                const corianderItem = document.getElementById('chk-coriander');
                if (corianderItem) {
                    const isOos = oos.includes('topping:加香菜') || oos.includes('topping:香菜');
                    if (isOos) {
                        corianderItem.checked = false;
                        corianderItem.disabled = true;
                        const label = corianderItem.closest('.checkbox-label');
                        if (label) {
                            label.style.opacity = '0.5';
                            label.style.pointerEvents = 'none';
                            label.style.textDecoration = 'line-through';
                            label.style.color = '#94a3b8';
                            if (!label.querySelector('.oos-badge')) {
                                label.insertAdjacentHTML('beforeend', ' <span class="oos-badge" style="color:#dc2626; font-size:12px; font-weight:900; text-decoration:none;">(已售完)</span>');
                            }
                        }
                    }
                }

                const lemonItem = document.getElementById('chk-lemon');
                if (lemonItem) {
                    const isOos = oos.includes('topping:檸檬汁') || oos.includes('topping:加檸檬汁');
                    if (isOos) {
                        lemonItem.checked = false;
                        lemonItem.disabled = true;
                        const label = lemonItem.closest('.checkbox-label');
                        if (label) {
                            label.style.opacity = '0.5';
                            label.style.pointerEvents = 'none';
                            label.style.textDecoration = 'line-through';
                            label.style.color = '#94a3b8';
                            if (!label.querySelector('.oos-badge')) {
                                label.insertAdjacentHTML('beforeend', ' <span class="oos-badge" style="color:#dc2626; font-size:12px; font-weight:900; text-decoration:none;">(已售完)</span>');
                            }
                        }
                    }
                }
            }

            const DEFAULT_CUSTOMIZATIONS = [
                {
                    key: "flavor",
                    title: "✦ 口味選擇",
                    type: "radio",
                    options: [
                        { name: "特調胡椒" },
                        { name: "泰式酸辣" },
                        { name: "清爽檸檬", sub_options: ["不加香油", "不加鹽巴"] },
                        { name: "檸檬香菜", sub_options: ["不加香油", "不加鹽巴"] },
                        { name: "原味客製", sub_options: ["不加香油", "不加胡椒", "不加胡椒加鹽巴"] }
                    ]
                },
                {
                    key: "salt",
                    title: "✦ 鹹度調整",
                    type: "radio",
                    options: [
                        { name: "正常" },
                        { name: "調味重" },
                        { name: "調味清淡" }
                    ]
                },
                {
                    key: "spicy",
                    title: "✦ 辣度選擇 (朝天椒)",
                    type: "radio",
                    options: [
                        { name: "不辣" },
                        { name: "微辣" },
                        { name: "小辣" },
                        { name: "中辣" },
                        { name: "大辣" },
                        { name: "辣椒放餐盒角落" }
                    ]
                },
                {
                    key: "ingredients",
                    title: "✦ 配料調整",
                    type: "checkbox",
                    options: [
                        { name: "不加蔥花" },
                        { name: "不加蒜頭" },
                        { name: "不加洋蔥" }
                    ]
                }
            ];

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            let loadedCustomizations = [];

            function renderCustomizations(customizations) {
                loadedCustomizations = (Array.isArray(customizations) && customizations.length > 0) ? customizations : DEFAULT_CUSTOMIZATIONS;
                const list = loadedCustomizations;
                const secFlavor = document.getElementById('sec-flavor');
                if (!secFlavor) return;

                let html = `<div class="section-title">🧪 口味與客製化選擇</div>
                <div class="custom-panel" style="margin-bottom: 20px; padding: 16px; background: #fff; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; color: #444;">`;

                list.forEach((group, groupIdx) => {
                    const topMargin = groupIdx > 0 ? 'margin-top: 16px;' : '';
                    html += `<div class="custom-group" style="${topMargin}">
                        <label class="custom-label" style="font-weight: 800; display: block; margin-bottom: 8px;">${escapeHtml(group.title)}</label>
                        <div class="${group.type === 'radio' ? 'radio-grid' : 'checkbox-grid-opts'}" style="display: flex; flex-wrap: wrap; gap: 12px;">`;

                    (group.options || []).forEach((opt, optIdx) => {
                        const optName = typeof opt === 'string' ? opt : (opt ? opt.name || '' : '');
                        const subOpts = (typeof opt === 'object' && opt && Array.isArray(opt.sub_options)) ? opt.sub_options : [];
                        const inputName = `opt-${group.key}`;
                        const isChecked = group.type === 'radio' ? (optIdx === 0 ? 'checked' : '') : '';
                        const onchangeAttr = group.type === 'radio' ? 'onchange="toggleFlavorSubOptions()"' : '';

                        if (group.type === 'radio') {
                            html += `<div class="flavor-option-container" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
                                <label class="radio-label"><input type="radio" name="${inputName}" value="${escapeHtml(optName)}" ${isChecked} ${onchangeAttr}> ${escapeHtml(optName)}</label>`;

                            if (subOpts.length > 0) {
                                html += `<div class="sub-option-container" data-parent-flavor="${escapeHtml(optName)}" style="display: none; margin-top: 10px; padding-left: 10px; border-left: 2px solid #ddd; gap: 15px; flex-wrap: wrap;">`;
                                subOpts.forEach((sub) => {
                                    html += `<label class="checkbox-label"><input type="checkbox" class="sub-opt-chk" data-flavor="${escapeHtml(optName)}" value="${escapeHtml(sub)}"> ${escapeHtml(sub)}</label>`;
                                });
                                html += `</div>`;
                            }

                            html += `</div>`;
                        } else {
                            html += `<label class="checkbox-label"><input type="checkbox" name="${inputName}" value="${escapeHtml(optName)}"> ${escapeHtml(optName)}</label>`;
                        }
                    });

                    html += `</div></div>`;
                });

                html += `
                    <div class="custom-group" style="margin-top: 16px; border-top: 1px dashed #eee; padding-top: 12px;">
                        <label class="custom-label" style="font-weight: 800; display: block; margin-bottom: 8px;">✦ 加價配料 (選加)</label>
                        <div class="checkbox-grid-opts" style="display: flex; flex-wrap: wrap; gap: 20px;">
                            <label class="checkbox-label" style="font-weight: 800; color: #b45309;"><input type="checkbox" id="chk-coriander" onchange="updateTotal()"> 加香菜 (+$15)</label>
                            <label class="checkbox-label" style="font-weight: 800; color: #b45309;"><input type="checkbox" id="chk-lemon" onchange="updateTotal()"> 加檸檬汁 (+$20)</label>
                        </div>
                    </div>
                </div>`;

                secFlavor.innerHTML = html;
                toggleFlavorSubOptions();
            }

            function toggleFlavorSubOptions() {
                const selectedRadio = document.querySelector('input[name="opt-flavor"]:checked');
                const selectedFlavor = selectedRadio ? selectedRadio.value : '';

                document.querySelectorAll('.sub-option-container').forEach(container => {
                    const parentFlavor = container.getAttribute('data-parent-flavor');
                    if (parentFlavor === selectedFlavor) {
                        container.style.display = 'flex';
                    } else {
                        container.style.display = 'none';
                        container.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = false);
                    }
                });
            }

            function renderMenu() {
                for (let name in menu.large) createItem(name, menu.large[name], 'large', 'meat-list', name, false);
                for (let name in menu.small) createItem(name, menu.small[name], 'small', 'side50-list', name, false);
                for (let name in menu.combo) createItem(name, menu.combo[name], 'combo', 'side30-list', name, false);
                for (let name in menu.drinks) createItem(name, menu.drinks[name], 'drinks', 'side25-list', name, false);
                for (let name in menu.veggie) createItem(name, menu.veggie[name], 'veggie', 'veggie-list', name, false);

                renderCustomizations(menu.customizations);
                updateToppingStockStatus();

                document.querySelectorAll('.section-container').forEach(sec => observer.observe(sec));
            }

            // --- CART LOGIC ---
            function updateQty(category, origName, change) {
                const key = category + '_' + origName;
                cart[key] = (cart[key] || 0) + change;
                if (cart[key] < 0) cart[key] = 0;

                const qtySpan = document.getElementById('qty-' + category + '-' + origName);
                if (qtySpan) {
                    qtySpan.innerText = cart[key];
                    qtySpan.style.color = cart[key] > 0 ? 'var(--primary)' : 'inherit';
                }

                updateTotal();
            }

            function updateTotal() {
                let total = 0;
                let totalQty = 0;
                let veggieQty = 0;
                let veggieSubtotal = 0;
                let summaryHTML = '';

                // 1. Calculate items
                for (let key in cart) {
                    if (cart[key] > 0) {
                        let [cat, origName] = key.split('_');
                        let qty = cart[key];
                        totalQty += qty;

                        let itemPrice = 0;
                        if (cat === 'large') { itemPrice = menu.large[origName] || 0; }
                        else if (cat === 'small') { itemPrice = menu.small[origName] || 0; }
                        else if (cat === 'combo') { itemPrice = menu.combo[origName] || 0; }
                        else if (cat === 'drinks') { itemPrice = menu.drinks[origName] || 0; }
                        else if (cat === 'veggie') { itemPrice = menu.veggie[origName] || 0; }

                        if (cat === 'veggie') {
                            veggieQty += qty;
                            veggieSubtotal += qty * itemPrice;
                        } else {
                            let lineTotal = qty * itemPrice;
                            total += lineTotal;
                        }

                        summaryHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <div style="font-weight:800;">${qty}x ${origName}</div>
                        <div>$${qty * itemPrice}</div>
                    </div>`;
                    }
                }

                // 2. Apply veggie discount (3 items for $100)
                if (veggieQty > 0) {
                    let discountedVeggiePrice = Math.floor(veggieQty / 3) * 100 + (veggieQty % 3) * 35;
                    let veggieDiscount = veggieSubtotal - discountedVeggiePrice;
                    total += discountedVeggiePrice;

                    if (veggieDiscount > 0) {
                        summaryHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; color:var(--red); font-weight:800;">
                        <div>配菜3樣$100優惠</div>
                        <div>-$${veggieDiscount}</div>
                    </div>`;
                    }
                }

                // 3. Apply order-level paid additions
                const hasCoriander = document.getElementById('chk-coriander')?.checked;
                const hasLemon = document.getElementById('chk-lemon')?.checked;
                if (hasCoriander) {
                    total += 15;
                    summaryHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; font-weight:800;">
                    <div>加香菜</div>
                    <div>$15</div>
                </div>`;
                }
                if (hasLemon) {
                    total += 20;
                    summaryHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; font-weight:800;">
                    <div>加檸檬汁</div>
                    <div>$20</div>
                </div>`;
                }

                // Update DOM
                const totalPriceEl = document.getElementById('total-price');
                if (totalPriceEl) totalPriceEl.innerText = total;

                const summaryContainer = document.getElementById('cart-summary');
                if (summaryContainer) {
                    if (totalQty === 0) {
                        summaryContainer.innerHTML = '<div style="text-align:center; color:#9ca3af;">(目前沒有已選商品)</div>';
                    } else {
                        summaryHTML += `<div style="border-bottom: 1px dashed #eee; margin-bottom: 8px;"></div>
                    <div style="display:flex; justify-content:space-between; font-weight:900; margin-top:12px; font-size:16px;">
                        <div>總計</div><div style="color:var(--primary);">$${total}</div>
                    </div>`;
                        summaryContainer.innerHTML = summaryHTML;
                    }
                }

                const badge = document.getElementById('cart-badge');
                if (badge) {
                    badge.innerText = totalQty;
                    badge.style.display = totalQty > 0 ? 'block' : 'none';
                }

                return total;
            }

            // --- ORDER SUBMIT ---
            function generateOrderNumber() {
                const now = new Date();
                const twTime = new Date(now.getTime() + 8 * 3600000);
                const month = String(twTime.getUTCMonth() + 1).padStart(2, '0');
                const day = String(twTime.getUTCDate()).padStart(2, '0');
                const hours = String(twTime.getUTCHours()).padStart(2, '0');
                const mins = String(twTime.getUTCMinutes()).padStart(2, '0');
                const randomSeq = Math.floor(1000 + Math.random() * 9000);
                return `B${month}${day}-${hours}${mins}-${randomSeq}`;
            }



        </script>
</body>

</html>
